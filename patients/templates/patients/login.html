{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:url("{% static 'images/hospital-bg.jpg' %}");
            font-family: Arial, sans-serif;

            background-size:cover;
            background-position:center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-box h1 {
            color: #0072ff;
            margin-bottom: 10px;
        }

        .login-box h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 60px;
            color: #00c6ff;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #0072ff;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg,#00c6ff,#0072ff);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }

        .error {
            color: red;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="icon">
        🏥
    </div>

    <h1>Hospital Management</h1>
    <h2>Admin Login</h2>


    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger text-center">{{ message }}</div>
        {% endfor %}
    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>


        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>


        <button type="submit">
            Login
        </button>
        <div class="text-center mt-3">
            <a href="{% url 'change_password' %}">
                Change Password
            </a>
</div>

    </form>


    <div class="footer">
        © 2026 Hospital Management System
    </div>

</div>


</body>
</html>
