
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

    <h2 class="text-center mb-4">⚙️ Hospital Settings</h2>

    <div class="row">

        <div class="col-md-6 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>👤 Profile</h5>
                    <a href="{% url 'profile' %}" class="btn btn-primary">Open</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>🔒 Change Password</h5>
                    <a href="{% url 'change_password' %}" class="btn btn-warning">Open</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>📋 Activity Log</h5>
                    <a href="{% url 'activity_log' %}" class="btn btn-info">Open</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>🚪 Logout</h5>
                    <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
